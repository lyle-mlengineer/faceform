<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfaf8">
  <meta name="description" content="Create original, photorealistic faces for your next campaign with Faceform.">
  <title>{{ page_title }} · Faceform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/site.css') }}">
  <script>
    window.FACEFORM = {
      apiBase: "/api/v1",
      firebase: {{ firebase_config | tojson }}
    };
  </script>
  <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% block content %}{% endblock %}
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
